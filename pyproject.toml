[project]
name = "ai-agentic-rag"
version = "0.1.0"
description = "A traceable research and knowledge-base assistant built with LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "duckdb>=1.2,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "langgraph>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.0,<4.0",
    "markdown-it-py>=3.0,<5.0",
    "pydantic-settings>=2.7,<3.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "python-pptx>=1.0,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "qdrant-client>=1.13,<2.0",
    "redis>=5.2,<7.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "trafilatura>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires Docker infrastructure to be running",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
